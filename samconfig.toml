# SAM CLI settings. Each [env.command.parameters] section holds the flags that would
# otherwise be typed on the command line; pick an environment with --config-env <env>.
version = 0.1

[default.global.parameters]
stack_name = "hello-world-api"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

# Cloud deployment. sam deploy --guided asks for AdminUsername / AlertEmail and saves the
# answers here. eu-north-1: the account's organization allows regional services only there.
[default.deploy.parameters]
stack_name = "hello-world-api"
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true

# Laptop: sam local start-api against the Docker emulators (plan step 3).
[local.build.parameters]
cached = true
parallel = true

[local.local_start_api.parameters]
# AlertEmail has no default; only the alarms and the budget use it, and they do not run locally.
parameter_overrides = "AlertEmail=local@example.invalid"
env_vars = "env.local.json"
docker_network = "hello-local"
warm_containers = "EAGER"
