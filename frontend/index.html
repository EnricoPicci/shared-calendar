<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- Everything starts hidden: the script shows the login or the frame (src/views/shell.ts). -->

    <!-- The login view (src/views/login.view.ts); its sign-in form is hidden while "Choose your
         password" is shown in its place -->
    <main id="login" class="login" hidden>
      <h1 data-text="frame.title"></h1>
      <!-- What the page says after the person changed their password, until the next "Sign in" -->
      <p class="notice" role="status"></p>
      <form class="sign-in">
        <label><span data-text="login.username"></span> <input name="username" autocomplete="username" autocapitalize="none" required /></label>
        <label><span data-text="login.password"></span> <input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary" data-text="login.signIn"></button>
        <p class="error" role="alert"></p>
      </form>
      <!-- The page's language, each language under its own name, filled by the script; hidden
           while "Choose your password" is on show -->
      <label class="language"><span data-text="login.language"></span> <select name="language"></select></label>
      <!-- "Choose your password" (src/views/choose-password.view.ts): an account whose password is
           temporary signs in, and chooses its own before it gets in. Two fields, each a .field
           with its hint; what the new password still misses is a list under it. The browser's
           own check is off: the script says in words what is missing. -->
      <section class="first-password" aria-labelledby="first-password-heading" hidden>
        <h2 id="first-password-heading" data-text="choose.heading"></h2>
        <p class="about"><span data-text="choose.aboutBefore"></span> <strong class="account"></strong> <span data-text="choose.aboutAfter"></span></p>
        <form class="new-password" novalidate>
          <div class="field new-field">
            <label><span data-text="password.newPassword"></span> <input name="next" type="password" autocomplete="new-password" aria-describedby="first-next-needs" /></label>
            <ul class="needs hint" id="first-next-needs"></ul>
          </div>
          <div class="field again-field">
            <label><span data-text="password.newPasswordAgain"></span> <input name="again" type="password" autocomplete="new-password" aria-describedby="first-again-hint" /></label>
            <p class="hint" id="first-again-hint"></p>
          </div>
          <p class="error failure" role="alert"></p>
          <div class="actions">
            <button class="primary submit" data-text="choose.submit"></button>
            <button type="button" class="cancel" data-text="common.cancel"></button>
          </div>
        </form>
        <!-- One condition the new password still misses -->
        <template id="tpl-first-password-need">
          <li class="need"></li>
        </template>
      </section>
    </main>

    <!-- The frame of the application, for a signed-in person (src/views/shell.ts) -->
    <div id="app" hidden>
      <header class="bar">
        <strong class="title" data-text="frame.title"></strong>
        <span class="who"><span class="username"></span> <span class="role"></span></span>
        <button type="button" class="sign-out" data-text="frame.signOut"></button>
      </header>
      <nav class="nav" data-label="frame.screens"></nav>
      <!-- A link of the navigation: the shell copies it once per screen the person may see -->
      <template id="tpl-nav-link">
        <a class="nav-link"></a>
      </template>

      <main class="screen">
        <!-- The week (src/views/week.view.ts), at the address #/week. An appointment opens the
             detail dialog, which is after the screens. -->
        <section id="week" class="week-screen" hidden>
          <div class="toolbar">
            <button type="button" class="previous" data-label="week.previous">‹</button>
            <button type="button" class="today" data-text="week.today"></button>
            <button type="button" class="next" data-label="week.next">›</button>
            <button type="button" class="mail-open" data-text="week.mailOpen"></button>
            <h2 class="week-label"></h2>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
          </div>
          <p class="error failure" role="alert" hidden></p>
          <!-- Shown while an appointment is being moved to another time: the next free slot
               clicked is the new time. Outside the region the script redraws. -->
          <div class="moving" hidden>
            <p role="status"><span data-text="week.movingBefore"></span> <span class="moving-what"></span><span data-text="week.movingAfter"></span></p>
            <button type="button" class="keep" data-text="week.keep"></button>
          </div>
          <p class="zone" hidden><span data-text="week.zoneBefore"></span> <span class="zone-name"></span><span data-text="week.zoneAfter"></span></p>
          <ul class="legend"></ul>

          <div class="week">
            <ol class="hours" aria-hidden="true"></ol>
            <div class="days"></div>
          </div>

          <!-- The book dialog: a free slot of the week, a note; for the Administrator also the
               User to book for and other times inside the slot's window. Outside the region
               the script redraws. It has a second mode, in which it confirms the move of an
               appointment to the slot: the parts marked in-booking are shown in the first mode
               only, those marked in-change in the second only. -->
          <dialog class="book" aria-labelledby="book-title">
            <form>
              <h3 id="book-title"><span class="in-booking" data-text="book.titleBooking"></span><span class="in-change" data-text="book.titleChange" hidden></span></h3>
              <p class="in-change" hidden><span data-text="book.from"></span> <span class="old"></span></p>
              <p><span class="in-change" hidden><span data-text="book.to"></span> </span><span class="what"></span></p>
              <div class="choices" hidden>
                <div class="user in-booking">
                  <label><span data-text="book.forUser"></span> <select name="username"></select></label>
                  <p class="users-message" role="status"></p>
                </div>
                <div class="times">
                  <fieldset class="clock">
                    <legend data-text="book.start"></legend>
                    <label><span class="unseen" data-text="book.hour"></span> <select name="start-hour"></select></label>
                    <span aria-hidden="true">:</span>
                    <label><span class="unseen" data-text="book.minute"></span> <select name="start-minute"></select></label>
                  </fieldset>
                  <fieldset class="clock">
                    <legend data-text="book.end"></legend>
                    <label><span class="unseen" data-text="book.hour"></span> <select name="end-hour"></select></label>
                    <span aria-hidden="true">:</span>
                    <label><span class="unseen" data-text="book.minute"></span> <select name="end-minute"></select></label>
                  </fieldset>
                </div>
              </div>
              <label><span data-text="common.note"></span> <textarea name="note" rows="3" maxlength="500"></textarea></label>
              <p class="error" role="alert"></p>
              <!-- Offered to the Administrator after a refusal because the time is full, for the
                   request refused only: it sends that request again over the capacity, and
                   changing anything in the dialog hides it. -->
              <div class="anyway" hidden>
                <p id="anyway-question"><span class="in-booking" data-text="book.anywayBooking"></span><span class="in-change" data-text="book.anywayChange" hidden></span></p>
                <button type="button" class="danger force" aria-describedby="anyway-question"><span class="in-booking" data-text="book.forceBooking"></span><span class="in-change" data-text="book.forceChange" hidden></span></button>
              </div>
              <div class="actions">
                <button type="button" class="close" data-text="common.close"></button>
                <button class="primary submit"><span class="in-booking" data-text="book.submit"></span><span class="in-change" data-text="common.change" hidden></span></button>
              </div>
            </form>
          </dialog>

          <!-- The mail of two dates, for both roles: what it holds is the role's, and it goes to
               the person's own address, which the page says once the mail is asked for. The
               script proposes the dates of the week on show. Outside the region the script
               redraws. -->
          <dialog class="mail" aria-labelledby="mail-title">
            <form>
              <h3 id="mail-title" data-text="mail.title"></h3>
              <p class="mail-what"></p>
              <div class="dates">
                <label><span data-text="common.from"></span> <input type="date" name="from"></label>
                <label><span data-text="common.to"></span> <input type="date" name="to"></label>
              </div>
              <p class="mail-sent" role="status"></p>
              <p class="error" role="alert"></p>
              <div class="actions">
                <button type="button" class="close" data-text="common.close"></button>
                <button class="primary submit" data-text="mail.send"></button>
              </div>
            </form>
          </dialog>

          <!-- The Administrator's list of four or more appointments at the same time, opened by
               their block: each row opens the appointment's detail. -->
          <dialog class="group" aria-labelledby="group-title">
            <h3 id="group-title" class="what"></h3>
            <p class="when"></p>
            <ul class="people"></ul>
            <div class="actions">
              <button type="button" class="close" data-text="common.close"></button>
            </div>
          </dialog>

          <!-- The pieces the script copies to draw a week. A slot and an appointment show
               their time: the script gives each a name for a screen reader that starts with
               its day. -->
          <template id="tpl-legend-item">
            <li></li>
          </template>
          <template id="tpl-hour">
            <li></li>
          </template>
          <template id="tpl-day">
            <section class="day">
              <h3></h3>
              <div class="day-body"></div>
            </section>
          </template>
          <template id="tpl-window">
            <div class="block window"><span class="type-name"></span></div>
          </template>
          <template id="tpl-busy">
            <div class="block busy"><span class="time"></span> <span data-text="week.busy"></span></div>
          </template>
          <template id="tpl-slot">
            <button type="button" class="block slot"><span class="time"></span> <span class="places"></span></button>
          </template>
          <template id="tpl-appointment">
            <button type="button" class="block appointment"><span class="time"></span> <strong class="who"></strong> <span class="note"></span></button>
          </template>
          <template id="tpl-group">
            <button type="button" class="block appointment group"><span class="time"></span> <strong class="what"></strong></button>
          </template>
          <!-- A row of the list of a group: its time and its User -->
          <template id="tpl-person">
            <li><button type="button" class="person"><span class="time"></span> <strong class="who"></strong></button></li>
          </template>
          <!-- A choice of a list in the book dialog -->
          <template id="tpl-option">
            <option></option>
          </template>
        </section>

        <!-- "My appointments" (src/views/appointments.view.ts), at the address #/appointments:
             a User's upcoming appointments, or all those of a period. The period's form is
             outside the list the script redraws. -->
        <section id="appointments" class="appointments-screen" hidden>
          <div class="toolbar">
            <button type="button" class="upcoming" aria-pressed="false" data-text="appointments.upcoming"></button>
            <button type="button" class="history" aria-pressed="false" data-text="appointments.history"></button>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
          </div>
          <!-- novalidate: a date left empty or half typed is refused by the script, in words -->
          <form class="period" novalidate hidden>
            <label><span data-text="common.from"></span> <input type="date" name="from" /></label>
            <label><span data-text="common.to"></span> <input type="date" name="to" /></label>
            <button class="submit" data-text="appointments.show"></button>
            <p class="error refusal" role="alert"></p>
          </form>
          <p class="error failure" role="alert" hidden></p>
          <p class="empty" hidden></p>
          <ul class="list"></ul>

          <!-- A row of the list: one button, which opens the appointment's detail -->
          <template id="tpl-appointment-row">
            <li>
              <button type="button" class="row"><span class="date"></span> <span class="time"></span> <span class="type-name"></span> <span class="note"></span> <span class="status"></span></button>
            </li>
          </template>
        </section>

        <!-- The settings (src/views/settings.view.ts), at the address #/settings: the four
             values of the calendar in one fixed form. A field in fault is said under it. -->
        <section id="settings" class="settings-screen" hidden>
          <div class="toolbar">
            <h2 data-text="settings.heading"></h2>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
          </div>
          <!-- Shown in the place of the form when the settings could not be read -->
          <div class="unread" hidden>
            <p class="error" role="alert"></p>
            <button type="button" class="retry" data-label="settings.retryLabel" data-text="common.retry"></button>
          </div>
          <!-- novalidate: a value out of range is refused by the script, in words, under its
               field. Each field is a .field: its label, its range, its refusal. -->
          <form class="settings" novalidate hidden>
            <div class="field">
              <label><span data-text="settings.cancellationNotice"></span> <input type="number" name="cancellationNoticeHours" inputmode="numeric" /></label>
              <p class="range"></p>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field">
              <label><span data-text="settings.minBookingNotice"></span> <input type="number" name="minBookingNoticeHours" inputmode="numeric" /></label>
              <p class="range"></p>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field">
              <label><span data-text="settings.bookingHorizon"></span> <input type="number" name="bookingHorizonDays" inputmode="numeric" /></label>
              <p class="range"></p>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field">
              <label><span data-text="settings.maxUpcoming"></span> <input type="number" name="maxFutureAppointmentsPerUser" inputmode="numeric" /></label>
              <label class="check"><input type="checkbox" name="noLimit" /> <span data-text="settings.noLimit"></span></label>
              <p class="range"></p>
              <p class="error refusal" role="alert"></p>
            </div>
            <p class="about"><span data-text="settings.zoneBefore"></span> <strong class="zone-name"></strong><span data-text="settings.zoneAfter"></span></p>
            <p class="about last-saved"></p>
            <p class="error failure" role="alert"></p>
            <p class="saved" role="status" data-text="settings.saved" hidden></p>
            <div class="actions">
              <button class="primary submit" data-text="common.save"></button>
            </div>
          </form>
          <!-- The daily e-mail (src/views/settings.view.ts, mountDailyMail): read and saved apart
               from the calendar's settings, so that a failure of one hides nothing of the other.
               In a stack where e-mail is not on yet, .unavailable says so in place of the form. -->
          <section class="daily-mail">
            <h3 data-text="daily.heading"></h3>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
            <p class="unavailable" role="status" hidden></p>
            <div class="unread" hidden>
              <p class="error" role="alert"></p>
              <button type="button" class="retry" data-label="daily.retryLabel" data-text="common.retry"></button>
            </div>
            <!-- novalidate: an hour that is not a whole hour is refused by the script, in words. -->
            <form class="settings daily" novalidate hidden>
              <label class="check"><input type="checkbox" name="dailyEnabled" /> <span data-text="daily.enabled"></span></label>
              <div class="field">
                <label><span data-text="daily.hour"></span> <input name="dailyHour" inputmode="numeric" autocomplete="off" /></label>
                <p class="range"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <p class="about" data-text="daily.about"></p>
              <p class="error failure" role="alert"></p>
              <p class="saved" role="status" data-text="daily.saved" hidden></p>
              <div class="actions">
                <button class="primary submit" data-text="daily.submit"></button>
              </div>
            </form>
          </section>
        </section>

        <!-- The users (src/views/users.view.ts), at the address #/users: a form that creates
             one, and the list, each row with its "Delete". The form is outside the list the
             script redraws. The field is a .field: its label, its hint, its refusal. -->
        <section id="users" class="users-screen" hidden>
          <div class="toolbar">
            <h2 data-text="users.heading"></h2>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
          </div>
          <!-- novalidate: a text that is not a username, or a fact that does not follow its rule,
               is refused by the script, in words, under its field. A browser must neither offer
               nor correct a username, nor fill another person's facts with the Administrator's
               own. -->
          <form class="create" novalidate>
            <div class="field username-field">
              <label><span data-text="login.username"></span> <input name="username" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="username-hint" /></label>
              <p class="hint" id="username-hint"></p>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field given-name-field">
              <label><span data-text="profile.givenName"></span> <input name="givenName" autocomplete="off" /></label>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field family-name-field">
              <label><span data-text="profile.familyName"></span> <input name="familyName" autocomplete="off" /></label>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field email-field">
              <label><span data-text="profile.email"></span> <input name="email" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" /></label>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field address-field">
              <label><span data-text="profile.address"></span> <textarea name="address" rows="3" autocomplete="off"></textarea></label>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="actions">
              <button class="primary submit" data-text="users.create"></button>
            </div>
          </form>
          <!-- Shown in the place of the list when it could not be read -->
          <div class="unread" hidden>
            <p class="error" role="alert"></p>
            <button type="button" class="retry" data-label="users.retryLabel" data-text="common.retry"></button>
          </div>
          <p class="empty" hidden></p>
          <ul class="list"></ul>

          <!-- A row of the list: the username, the name, the e-mail and the state of the account
               (invited or active), and its buttons, whose names for a screen reader the script
               completes with the username. "Resend invitation" is shown for an invited User only. -->
          <template id="tpl-user-row">
            <li class="user-row">
              <span class="username"></span> <span class="name"></span> <span class="email"></span> <span class="status"></span>
              <span class="row-buttons"><button type="button" class="ask-edit" data-text="common.edit"></button> <button type="button" class="ask-resend" data-text="users.resend" hidden></button>
              <button type="button" class="danger ask-delete" data-text="common.delete"></button></span>
            </li>
          </template>

          <!-- The four facts of one User, changed by the Administrator. "Cancel" closes it and
               keeps nothing typed; it closes by itself once a save succeeded. -->
          <dialog class="edit" aria-labelledby="edit-title">
            <h3 id="edit-title"></h3>
            <form class="profile" novalidate>
              <div class="field given-name-field">
                <label><span data-text="profile.givenName"></span> <input name="givenName" autocomplete="off" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field family-name-field">
                <label><span data-text="profile.familyName"></span> <input name="familyName" autocomplete="off" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field email-field">
                <label><span data-text="profile.email"></span> <input name="email" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field address-field">
                <label><span data-text="profile.address"></span> <textarea name="address" rows="3" autocomplete="off"></textarea></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <p class="error failure" role="alert"></p>
              <div class="actions">
                <button type="button" class="cancel" data-text="common.cancel"></button>
                <button class="primary submit" data-text="common.save"></button>
              </div>
            </form>
          </dialog>

          <!-- The last look before an invitation goes, from "Create user" or from a row's "Resend
               invitation": the address it goes to. "Back" comes first: the keyboard is on it when
               the dialog opens, and a screen reader then says the question, which describes the
               dialog. Once the invitation went, the dialog says where, and "Close" is its one
               button; a failure is said in it, and it stays open. -->
          <dialog class="invite" aria-labelledby="invite-title" aria-describedby="invite-question">
            <h3 id="invite-title" data-text="users.inviteTitle"></h3>
            <p class="question" id="invite-question"></p>
            <p class="answer" role="status"></p>
            <p class="error" role="alert"></p>
            <div class="actions">
              <button type="button" class="back" data-text="common.back"></button>
              <button type="button" class="primary submit" data-text="common.confirm"></button>
              <button type="button" class="primary done" data-text="common.close" hidden></button>
            </div>
          </dialog>

          <!-- Asks before a user is deleted. "Keep" comes first: the keyboard is on it when
               the dialog opens, and a screen reader then says the question, which describes
               the dialog. -->
          <dialog class="delete" aria-labelledby="delete-title" aria-describedby="delete-question">
            <h3 id="delete-title" data-text="users.deleteUser"></h3>
            <p class="question" id="delete-question"></p>
            <p class="error" role="alert"></p>
            <div class="actions">
              <button type="button" class="keep" data-text="users.keep"></button>
              <button type="button" class="danger submit" data-text="users.deleteUser"></button>
            </div>
          </dialog>
        </section>

        <!-- The availability (src/views/availability.view.ts), at the address #/availability:
             the availability types and the weekly patterns, each with a form that creates
             one and its list. The forms are outside the lists the script redraws; a row holds
             buttons only, which open a dialog. Each field is a .field: its label, its hint
             when it has one, its refusal. The choices of every list are the script's to set. -->
        <section id="availability" class="availability-screen" hidden>
          <div class="toolbar">
            <h2 data-text="availability.heading"></h2>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
          </div>

          <section class="types">
            <h3 data-text="availability.types"></h3>
            <!-- novalidate: a text that is not a name, or a capacity out of its bounds, is
                 refused by the script, in words, under its field -->
            <form class="create create-type" novalidate>
              <div class="field">
                <label><span data-text="availability.name"></span> <input name="name" autocomplete="off" aria-describedby="type-name-hint" /></label>
                <p class="hint name-hint" id="type-name-hint"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <label><span data-text="availability.capacity"></span> <input type="number" name="capacity" inputmode="numeric" aria-describedby="type-capacity-hint" /></label>
                <p class="hint capacity-hint" id="type-capacity-hint"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <p class="error failure" role="alert"></p>
              <div class="actions">
                <button class="primary submit" data-text="availability.createType"></button>
              </div>
            </form>
            <!-- Shown in the place of the list when it could not be read -->
            <div class="unread" hidden>
              <p class="error" role="alert"></p>
              <button type="button" class="retry" data-label="availability.retryTypes" data-text="common.retry"></button>
            </div>
            <p class="empty" hidden></p>
            <ul class="list"></ul>
          </section>

          <section class="patterns">
            <h3 data-text="availability.patterns"></h3>
            <!-- novalidate: a field in fault is said by the script, in words, under it -->
            <form class="create-pattern" novalidate>
              <div class="pattern-fields">
                <div class="field">
                  <label><span data-text="availability.weekday"></span> <select name="weekday"></select></label>
                  <p class="error refusal" role="alert"></p>
                </div>
                <div class="field">
                  <fieldset class="clock">
                    <legend data-text="book.start"></legend>
                    <label><span class="unseen" data-text="book.hour"></span> <select name="start-hour"></select></label>
                    <span aria-hidden="true">:</span>
                    <label><span class="unseen" data-text="book.minute"></span> <select name="start-minute"></select></label>
                  </fieldset>
                  <p class="error refusal" role="alert"></p>
                </div>
                <div class="field">
                  <fieldset class="clock">
                    <legend data-text="book.end"></legend>
                    <label><span class="unseen" data-text="book.hour"></span> <select name="end-hour"></select></label>
                    <span aria-hidden="true">:</span>
                    <label><span class="unseen" data-text="book.minute"></span> <select name="end-minute"></select></label>
                  </fieldset>
                  <p class="error refusal" role="alert"></p>
                </div>
                <div class="field">
                  <label><span data-text="detail.type"></span> <select name="typeId" aria-describedby="pattern-type-hint"></select></label>
                  <p class="hint type-hint" id="pattern-type-hint"></p>
                  <p class="error refusal" role="alert"></p>
                </div>
                <div class="field">
                  <label><span data-text="availability.validFrom"></span> <input type="date" name="validFrom" /></label>
                  <p class="error refusal" role="alert"></p>
                </div>
                <div class="field">
                  <label><span data-text="availability.validUntil"></span> <input type="date" name="validUntil" aria-describedby="pattern-until-hint" /></label>
                  <p class="hint" id="pattern-until-hint" data-text="availability.noEnd"></p>
                  <p class="error refusal" role="alert"></p>
                </div>
              </div>
              <p class="error failure" role="alert"></p>
              <div class="conflicts" hidden>
                <p class="conflicts-count"></p>
                <ul class="conflicts-list"></ul>
              </div>
              <div class="actions">
                <button class="primary submit" data-text="availability.createPattern"></button>
              </div>
            </form>
            <!-- Shown in the place of the list when it could not be read -->
            <div class="unread" hidden>
              <p class="error" role="alert"></p>
              <button type="button" class="retry" data-label="availability.retryPatterns" data-text="common.retry"></button>
            </div>
            <p class="empty" hidden></p>
            <div class="groups"></div>
          </section>

          <!-- One date: the day as the weekly patterns give it and as it is now, and what
               changes it. Every row holds buttons only; every form is outside the lists. -->
          <section class="one-date">
            <h3 data-text="availability.singleDate"></h3>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
            <!-- novalidate: a date that cannot be shown is refused by the script, in words,
                 under the field -->
            <form class="choose" novalidate>
              <div class="field">
                <label><span data-text="availability.date"></span> <input type="date" name="date" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="actions">
                <button class="primary submit" data-text="appointments.show"></button>
              </div>
            </form>
            <!-- Shown in the place of the day when it could not be read -->
            <div class="unread" hidden>
              <p class="error" role="alert"></p>
              <button type="button" class="retry" data-label="availability.retryDate" data-text="common.retry"></button>
            </div>
            <div class="shown" hidden>
              <p class="date-words"></p>
              <div class="given">
                <h4 data-text="availability.asPatterns"></h4>
                <p class="none"></p>
                <ul class="list given-rows"></ul>
              </div>
              <div class="as-now">
                <h4 data-text="availability.asNow"></h4>
                <p class="which"></p>
                <ul class="list own-rows"></ul>
                <div class="actions">
                  <button type="button" class="edit" data-text="availability.editDay"></button>
                  <button type="button" class="make-closed" data-text="availability.makeClosed"></button>
                  <button type="button" class="back" data-text="availability.backToPatterns"></button>
                </div>
              </div>
              <!-- "This day only": the windows being put together. Nothing is sent before
                   "Save this day". -->
              <div class="draft" hidden>
                <h4 data-text="availability.thisDayOnly"></h4>
                <p class="draft-empty"></p>
                <ul class="list draft-rows"></ul>
                <form class="add-draft" novalidate>
                  <div class="window-fields">
                    <div class="field">
                      <fieldset class="clock">
                        <legend data-text="book.start"></legend>
                        <label><span class="unseen" data-text="book.hour"></span> <select name="start-hour"></select></label>
                        <span aria-hidden="true">:</span>
                        <label><span class="unseen" data-text="book.minute"></span> <select name="start-minute"></select></label>
                      </fieldset>
                      <p class="error refusal" role="alert"></p>
                    </div>
                    <div class="field">
                      <fieldset class="clock">
                        <legend data-text="book.end"></legend>
                        <label><span class="unseen" data-text="book.hour"></span> <select name="end-hour"></select></label>
                        <span aria-hidden="true">:</span>
                        <label><span class="unseen" data-text="book.minute"></span> <select name="end-minute"></select></label>
                      </fieldset>
                      <p class="error refusal" role="alert"></p>
                    </div>
                    <div class="field">
                      <label><span data-text="detail.type"></span> <select name="typeId"></select></label>
                      <p class="error refusal" role="alert"></p>
                    </div>
                  </div>
                  <p class="error failure" role="alert"></p>
                  <div class="actions">
                    <button class="submit" data-text="availability.add"></button>
                  </div>
                </form>
                <p class="error failure save-failure" role="alert"></p>
                <div class="conflicts" hidden>
                  <p class="conflicts-count"></p>
                  <ul class="conflicts-list"></ul>
                </div>
                <div class="actions">
                  <button type="button" class="discard" data-text="availability.discard"></button>
                  <button type="button" class="primary save" data-text="availability.saveDay"></button>
                </div>
              </div>
              <div class="extras">
                <h4 data-text="availability.extraWindows"></h4>
                <p class="none"></p>
                <ul class="list extra-rows"></ul>
                <form class="add-window" novalidate>
                  <div class="window-fields">
                    <div class="field">
                      <fieldset class="clock">
                        <legend data-text="book.start"></legend>
                        <label><span class="unseen" data-text="book.hour"></span> <select name="start-hour"></select></label>
                        <span aria-hidden="true">:</span>
                        <label><span class="unseen" data-text="book.minute"></span> <select name="start-minute"></select></label>
                      </fieldset>
                      <p class="error refusal" role="alert"></p>
                    </div>
                    <div class="field">
                      <fieldset class="clock">
                        <legend data-text="book.end"></legend>
                        <label><span class="unseen" data-text="book.hour"></span> <select name="end-hour"></select></label>
                        <span aria-hidden="true">:</span>
                        <label><span class="unseen" data-text="book.minute"></span> <select name="end-minute"></select></label>
                      </fieldset>
                      <p class="error refusal" role="alert"></p>
                    </div>
                    <div class="field">
                      <label><span data-text="detail.type"></span> <select name="typeId"></select></label>
                      <p class="error refusal" role="alert"></p>
                    </div>
                  </div>
                  <p class="error failure" role="alert"></p>
                  <div class="actions">
                    <button class="submit" data-text="availability.addWindow"></button>
                  </div>
                </form>
              </div>
            </div>
          </section>

          <!-- A row of the types: the name and its two buttons, whose names for a screen
               reader the script completes with the name -->
          <template id="tpl-type-row">
            <li class="type-row"><span class="name"></span> <span class="places"></span> <button type="button" class="ask-rename" data-text="common.edit"></button> <button type="button" class="danger ask-delete" data-text="common.delete"></button></li>
          </template>
          <!-- The patterns of one weekday, under its name -->
          <template id="tpl-pattern-group">
            <section class="pattern-group">
              <h4></h4>
              <ul class="list"></ul>
            </section>
          </template>
          <!-- A row of the patterns: its hours, its type, its validity, "ended" when that is
               over, and its two buttons -->
          <template id="tpl-pattern-row">
            <li class="pattern-row"><span class="time"></span> <span class="type-name"></span> <span class="validity"></span> <span class="ended" data-text="availability.ended" hidden></span> <button type="button" class="ask-change" data-text="common.change"></button> <button type="button" class="danger ask-delete" data-text="common.delete"></button></li>
          </template>
          <!-- An appointment in the way of a change of availability: one row of a conflicts list -->
          <template id="tpl-conflict">
            <li><span class="date"></span> <span class="time"></span> <span class="username"></span></li>
          </template>
          <!-- A choice of a list of the pattern forms and of the forms that add a window -->
          <template id="tpl-choice">
            <option></option>
          </template>
          <!-- A window of a single date, to read: its hours and its type -->
          <template id="tpl-date-window">
            <li class="window-row"><span class="time"></span> <span class="type-name"></span></li>
          </template>
          <!-- A window of "this day only" while it is being put together: the same, and the
               button that takes it out, whose name for a screen reader the script completes -->
          <template id="tpl-draft-row">
            <li class="window-row"><span class="time"></span> <span class="type-name"></span> <button type="button" class="remove" data-text="availability.remove"></button></li>
          </template>
          <!-- An extra window of a single date: the same, and the button that asks to delete it -->
          <template id="tpl-extra-row">
            <li class="window-row"><span class="time"></span> <span class="type-name"></span> <button type="button" class="danger ask-delete" data-text="common.delete"></button></li>
          </template>

          <!-- Edits a type: its name and its capacity, opened with its own -->
          <dialog class="rename" aria-labelledby="rename-title">
            <form novalidate>
              <h3 id="rename-title" data-text="availability.editType"></h3>
              <div class="field">
                <label><span data-text="availability.name"></span> <input name="name" autocomplete="off" aria-describedby="rename-hint" /></label>
                <p class="hint name-hint" id="rename-hint"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <label><span data-text="availability.capacity"></span> <input type="number" name="capacity" inputmode="numeric" aria-describedby="rename-capacity-hint" /></label>
                <p class="hint capacity-hint" id="rename-capacity-hint"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <p class="error failure" role="alert"></p>
              <div class="actions">
                <button type="button" class="close" data-text="common.close"></button>
                <button class="primary submit" data-text="common.save"></button>
              </div>
            </form>
          </dialog>

          <!-- Changes a pattern: the fields of the form that creates one, opened with the
               pattern's own -->
          <dialog class="change" aria-labelledby="change-title">
            <form novalidate>
              <h3 id="change-title" data-text="availability.changePattern"></h3>
              <div class="field">
                <label><span data-text="availability.weekday"></span> <select name="weekday"></select></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <fieldset class="clock">
                  <legend data-text="book.start"></legend>
                  <label><span class="unseen" data-text="book.hour"></span> <select name="start-hour"></select></label>
                  <span aria-hidden="true">:</span>
                  <label><span class="unseen" data-text="book.minute"></span> <select name="start-minute"></select></label>
                </fieldset>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <fieldset class="clock">
                  <legend data-text="book.end"></legend>
                  <label><span class="unseen" data-text="book.hour"></span> <select name="end-hour"></select></label>
                  <span aria-hidden="true">:</span>
                  <label><span class="unseen" data-text="book.minute"></span> <select name="end-minute"></select></label>
                </fieldset>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <label><span data-text="detail.type"></span> <select name="typeId" aria-describedby="change-type-hint"></select></label>
                <p class="hint type-hint" id="change-type-hint"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <label><span data-text="availability.validFrom"></span> <input type="date" name="validFrom" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field">
                <label><span data-text="availability.validUntil"></span> <input type="date" name="validUntil" aria-describedby="change-until-hint" /></label>
                <p class="hint" id="change-until-hint" data-text="availability.noEnd"></p>
                <p class="error refusal" role="alert"></p>
              </div>
              <p class="error failure" role="alert"></p>
              <div class="conflicts" hidden>
                <p class="conflicts-count"></p>
                <ul class="conflicts-list"></ul>
              </div>
              <div class="actions">
                <button type="button" class="close" data-text="common.close"></button>
                <button class="primary submit" data-text="common.change"></button>
              </div>
            </form>
          </dialog>

          <!-- Asks before a type, a pattern, a date's own windows or an extra window is deleted,
               and before a date is made not available: what will happen is in the question.
               "Keep" comes first: the keyboard is on it when the dialog opens, and a screen
               reader then says the question, which describes the dialog. -->
          <dialog class="delete" aria-labelledby="availability-delete-title" aria-describedby="availability-delete-question">
            <h3 id="availability-delete-title" data-text="availability.confirmTitle"></h3>
            <p class="question" id="availability-delete-question"></p>
            <p class="error" role="alert"></p>
            <div class="conflicts" hidden>
              <p class="conflicts-count"></p>
              <ul class="conflicts-list"></ul>
            </div>
            <div class="actions">
              <button type="button" class="keep" data-text="users.keep"></button>
              <button type="button" class="danger submit" data-text="common.confirm"></button>
            </div>
          </dialog>
        </section>

        <!-- The password (src/views/password.view.ts), at the address #/password: the person
             changes their own password. One fixed form, three fields, each a .field with its
             hint; what the new password still misses is a list under it. The browser's own
             check is off: the script says in words what is missing. After a change the person
             signs in again. -->
        <section id="password" class="password-screen" hidden>
          <div class="toolbar">
            <h2 data-text="password.heading"></h2>
          </div>
          <form class="change-password" novalidate>
            <div class="field current-field">
              <label><span data-text="password.current"></span> <input name="current" type="password" autocomplete="current-password" aria-describedby="current-hint" /></label>
              <p class="hint" id="current-hint"></p>
              <p class="error refusal" role="alert"></p>
            </div>
            <div class="field new-field">
              <label><span data-text="password.newPassword"></span> <input name="next" type="password" autocomplete="new-password" aria-describedby="next-needs" /></label>
              <ul class="needs hint" id="next-needs"></ul>
            </div>
            <div class="field again-field">
              <label><span data-text="password.newPasswordAgain"></span> <input name="again" type="password" autocomplete="new-password" aria-describedby="again-hint" /></label>
              <p class="hint" id="again-hint"></p>
            </div>
            <p class="about" data-text="password.about"></p>
            <p class="error failure" role="alert"></p>
            <div class="actions">
              <button class="primary submit" data-text="password.submit"></button>
            </div>
          </form>
          <!-- One condition the new password still misses -->
          <template id="tpl-password-need">
            <li class="need"></li>
          </template>
        </section>
        <!-- My details (src/views/me.view.ts), at the address #/me, for both roles: the
             person's own four facts. The Administrator has "Edit", which opens a dialog with
             the four fields; a User reads only. A fact the account does not hold yet reads
             "Not set". -->
        <section id="me" class="me-screen" hidden>
          <div class="toolbar">
            <h2 data-text="me.heading"></h2>
            <span class="loading" role="status" data-text="common.loading" hidden></span>
          </div>
          <!-- Shown in the place of the details when they could not be read -->
          <div class="unread" hidden>
            <p class="error" role="alert"></p>
            <button type="button" class="retry" data-label="me.retryLabel" data-text="common.retry"></button>
          </div>
          <dl class="details" hidden>
            <dt data-text="login.username"></dt>
            <dd class="username"></dd>
            <dt data-text="me.role"></dt>
            <dd class="role"></dd>
            <dt data-text="profile.givenName"></dt>
            <dd class="given-name"></dd>
            <dt data-text="profile.familyName"></dt>
            <dd class="family-name"></dd>
            <dt data-text="profile.email"></dt>
            <dd class="email"></dd>
            <dt data-text="profile.address"></dt>
            <dd class="address"></dd>
          </dl>
          <p class="about user-only" data-text="me.about" hidden></p>
          <div class="actions">
            <button type="button" class="primary ask-edit" data-text="common.edit" hidden></button>
          </div>
          <!-- The person's language, the pages' and the mails': each language under its own name,
               filled by the script, saved as soon as another is chosen -->
          <div class="field language-field">
            <label><span data-text="me.language"></span> <select name="language"></select></label>
            <p class="error refusal" role="alert"></p>
          </div>

          <!-- The Administrator's own four facts. "Cancel" closes it and keeps nothing typed; it
               closes by itself once a save succeeded. -->
          <dialog class="edit" aria-labelledby="me-edit-title">
            <h3 id="me-edit-title" data-text="me.editTitle"></h3>
            <form class="profile" novalidate>
              <div class="field given-name-field">
                <label><span data-text="profile.givenName"></span> <input name="givenName" autocomplete="given-name" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field family-name-field">
                <label><span data-text="profile.familyName"></span> <input name="familyName" autocomplete="family-name" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field email-field">
                <label><span data-text="profile.email"></span> <input name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" /></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <div class="field address-field">
                <label><span data-text="profile.address"></span> <textarea name="address" rows="3" autocomplete="street-address"></textarea></label>
                <p class="error refusal" role="alert"></p>
              </div>
              <p class="error failure" role="alert"></p>
              <div class="actions">
                <button type="button" class="cancel" data-text="common.cancel"></button>
                <button class="primary submit" data-text="common.save"></button>
              </div>
            </form>
          </dialog>
        </section>
      </main>

      <!-- The detail of one appointment, with what can be done to it
           (src/views/detail.view.ts). It belongs to no screen: the week and "My appointments"
           both open it, each while it is on show. The note is a text to read (the part .noted)
           or, while it can be edited, the field of the form. -->
      <dialog id="detail" class="detail" aria-labelledby="detail-title">
        <h3 id="detail-title" data-text="detail.title"></h3>
        <dl>
          <dt data-text="detail.when"></dt>
          <dd class="when"></dd>
          <dt data-text="detail.type"></dt>
          <dd class="typeName"></dd>
          <dt data-text="detail.forUser"></dt>
          <dd class="who"></dd>
          <div class="noted">
            <dt data-text="common.note"></dt>
            <dd class="note"></dd>
          </div>
        </dl>
        <form class="note-form" hidden>
          <label><span data-text="common.note"></span> <textarea name="note" rows="3" maxlength="500"></textarea></label>
          <button class="submit" data-text="detail.saveNote"></button>
        </form>
        <p class="booked"></p>
        <p class="hint"></p>
        <p class="error" role="alert"></p>
        <div class="actions">
          <button type="button" class="close" data-text="common.close"></button>
          <button type="button" class="change" data-text="common.change" hidden></button>
          <button type="button" class="danger cancel" data-text="detail.cancelAppointment" hidden></button>
        </div>
      </dialog>

      <!-- The assistant (src/views/assistant.view.ts): a panel at the bottom of the window,
           after the screens and in none of them, mounted once for a person's whole session.
           Collapsed, it is one bar: the heading and the field. Open, the part .talk shows the
           conversation between the two. Every text of a conversation is set as plain text. -->
      <section id="assistant" class="assistant" aria-labelledby="assistant-name" hidden>
        <div class="assistant-head">
          <h2><button type="button" id="assistant-name" class="toggle" aria-expanded="false" aria-controls="assistant-talk" data-text="assistant.toggle"></button></h2>
          <button type="button" class="end" data-text="assistant.end" hidden></button>
          <button type="button" class="collapse" data-text="common.close" hidden></button>
        </div>
        <div id="assistant-talk" class="talk" hidden>
          <p class="processed" data-text="assistant.processed"></p>
          <ol class="messages"></ol>
          <!-- One message: who wrote it, in words, and its text -->
          <template id="tpl-message">
            <li class="message"><span class="author"></span><p class="text"></p></li>
          </template>
          <p class="progress"></p>
          <!-- What a screen reader says when the reader is free: a new answer, a notice, a line
               of progress. Not on show: the same words are in the conversation. -->
          <p class="news" role="status"></p>
          <!-- A proposal: the server's question, its changes, its two buttons with the server's
               labels. Once settled the buttons go and each change says what became of it. -->
          <div class="proposal" hidden>
            <p class="asks"></p>
            <ul class="changes"></ul>
            <template id="tpl-proposed">
              <li class="proposed"><span class="summary"></span> <strong class="outcome"></strong></li>
            </template>
            <div class="actions">
              <button type="button" class="primary confirm"><span class="words"></span></button>
              <button type="button" class="decline"><span class="words"></span></button>
            </div>
          </div>
          <p class="error" role="alert"></p>
          <p class="remaining"></p>
        </div>
        <form class="compose">
          <label><span data-text="assistant.message"></span> <input name="message" autocomplete="off" enterkeyhint="send" /></label>
          <button class="primary send" data-text="assistant.send"></button>
        </form>
      </section>
    </div>
  </body>
</html>
