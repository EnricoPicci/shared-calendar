<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared calendar</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- Everything starts hidden: the script shows the login or the frame (src/views/shell.ts). -->

    <!-- The login view (src/views/login.view.ts) -->
    <main id="login" class="login" hidden>
      <h1>Shared calendar</h1>
      <form>
        <label>Username <input name="username" autocomplete="username" autocapitalize="none" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary">Sign in</button>
        <p class="error" role="alert"></p>
      </form>
    </main>

    <!-- The frame of the application, for a signed-in person (src/views/shell.ts) -->
    <div id="app" hidden>
      <header class="bar">
        <strong class="title">Shared calendar</strong>
        <span class="who"><span class="username"></span> <span class="role"></span></span>
        <button type="button" class="sign-out">Sign out</button>
      </header>
      <nav class="nav" aria-label="Screens"></nav>
      <!-- A link of the navigation: the shell copies it once per screen the person may see -->
      <template id="tpl-nav-link">
        <a class="nav-link"></a>
      </template>

      <main class="screen">
        <!-- The week (src/views/week.view.ts), at the address #/week -->
        <section id="week" class="week-screen" hidden>
          <div class="toolbar">
            <button type="button" class="previous" aria-label="Previous week">‹</button>
            <button type="button" class="today">Today</button>
            <button type="button" class="next" aria-label="Next week">›</button>
            <h2 class="week-label"></h2>
            <span class="loading" role="status" hidden>Loading…</span>
          </div>
          <p class="error failure" role="alert" hidden></p>
          <p class="zone" hidden>Times are in the calendar's time zone, <span class="zone-name"></span>.</p>
          <ul class="legend"></ul>

          <div class="week">
            <ol class="hours" aria-hidden="true"></ol>
            <div class="days"></div>
          </div>

          <!-- The book dialog: a free slot of the week, a note; for the Administrator also the
               User to book for and other times inside the slot's window. Outside the region
               the script redraws. -->
          <dialog class="book" aria-labelledby="book-title">
            <form>
              <h3 id="book-title">Book an appointment</h3>
              <p class="what"></p>
              <div class="choices" hidden>
                <label>For <select name="username"></select></label>
                <p class="users-message" role="status"></p>
                <div class="times">
                  <label>From <select name="start"></select></label>
                  <label>To <select name="end"></select></label>
                </div>
              </div>
              <label>Note <textarea name="note" rows="3" maxlength="500"></textarea></label>
              <p class="error" role="alert"></p>
              <div class="actions">
                <button type="button" class="close">Close</button>
                <button class="primary submit">Book</button>
              </div>
            </form>
          </dialog>

          <!-- The detail of one appointment, with what can be done to it -->
          <dialog class="detail" aria-labelledby="detail-title">
            <h3 id="detail-title">Appointment</h3>
            <dl>
              <dt>When</dt>
              <dd class="when"></dd>
              <dt>Type</dt>
              <dd class="typeName"></dd>
              <dt>For</dt>
              <dd class="who"></dd>
              <dt>Note</dt>
              <dd class="note"></dd>
            </dl>
            <p class="booked"></p>
            <p class="hint"></p>
            <p class="error" role="alert"></p>
            <div class="actions">
              <button type="button" class="close">Close</button>
              <button type="button" class="danger cancel" hidden>Cancel appointment</button>
            </div>
          </dialog>

          <!-- The pieces the script copies to draw a week -->
          <template id="tpl-legend-item">
            <li></li>
          </template>
          <template id="tpl-hour">
            <li></li>
          </template>
          <template id="tpl-day">
            <section class="day">
              <h3></h3>
              <div class="day-body"></div>
            </section>
          </template>
          <template id="tpl-window">
            <div class="block window"><span class="type-name"></span></div>
          </template>
          <template id="tpl-busy">
            <div class="block busy"><span class="time"></span> busy</div>
          </template>
          <template id="tpl-slot">
            <button type="button" class="block slot"><span class="time"></span> free</button>
          </template>
          <template id="tpl-appointment">
            <button type="button" class="block appointment"><span class="time"></span> <strong class="who"></strong> <span class="note"></span></button>
          </template>
          <!-- A choice of a list in the book dialog -->
          <template id="tpl-option">
            <option></option>
          </template>
        </section>
      </main>
    </div>
  </body>
</html>
