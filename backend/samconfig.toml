# SAM CLI settings. Each [env.command.parameters] section holds the flags that would
# otherwise be typed on the command line; pick an environment with --config-env <env>.
version = 0.1

[default.global.parameters]
stack_name = "hello-world-api"
region = "eu-north-1"

# Monorepo build (docs/FOLDER_STRUCTURE.md 4.3). esbuild runs inside backend/
# (build_in_source), where node_modules/@shared-calendar/shared, the workspace link to ../shared,
# resolves. Together with SAM_CLI_BETA_NODEJS_MONOREPO=1 (set by npm run build and
# scripts/local-api.sh) SAM installs once at the repository root from the lock file, keeping the
# dev tools, instead of an npm update per function that would strip them. The beta skips cached
# builds, hence cached = false.
[default.build.parameters]
cached = false
parallel = true
build_in_source = true

[default.validate.parameters]
lint = true

# Cloud deployment. eu-north-1: the account's organization allows regional services only there.
# AlertEmail is deliberately not here (the repository is public): the first deploy of a stack
# passes it once, npm run deploy -- --parameter-overrides AlertEmail=you@example.com, and
# CloudFormation keeps it; later deploys leave it out and SAM reuses the stack's stored value.
[default.deploy.parameters]
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
s3_prefix = "hello-world-api"
parameter_overrides = "AdminUsername=\"admin\" FunctionArchitecture=\"arm64\""
image_repositories = []

# Laptop: sam local start-api against the Docker emulators (plan step 3).
[local.build.parameters]
cached = false
parallel = true
build_in_source = true

[local.local_start_api.parameters]
# AlertEmail has no default; only the alarms use it, and they do not run locally.
parameter_overrides = "AlertEmail=local@example.invalid"
env_vars = "env.local.json"
docker_network = "hello-local"
warm_containers = "EAGER"
