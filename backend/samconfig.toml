# SAM CLI settings. Each [env.command.parameters] section holds the flags that would
# otherwise be typed on the command line; pick an environment with --config-env <env>.
version = 0.1

[default.global.parameters]
stack_name = "shared-calendar-api"
region = "eu-north-1"

# Monorepo build (docs/FOLDER_STRUCTURE.md section 4.3). esbuild runs inside backend/
# (build_in_source), where node_modules/@shared-calendar/shared, the workspace link to ../shared,
# resolves. Together with SAM_CLI_BETA_NODEJS_MONOREPO=1 (set by npm run build and
# scripts/local-api.sh) SAM installs once at the repository root from the lock file, keeping the
# dev tools, instead of an npm update per function that would strip them. The beta skips cached
# builds, hence cached = false.
[default.build.parameters]
cached = false
parallel = true
build_in_source = true

[default.validate.parameters]
lint = true

# Cloud deployment. eu-north-1: the account's organization allows regional services only there.
# AlertEmail is deliberately not here (the repository is public): the first deploy of a stack
# passes it once and CloudFormation keeps it; later deploys leave it out and SAM reuses the
# stack's stored value.
#
# The template's parameters set here, so that what the cloud runs is written in the repository:
# - AdminUsername: the Administrator's account, created by the deployment. Never changed after
#   the first deploy, or CloudFormation deletes and recreates the Administrator.
# - FunctionArchitecture: arm64, the cloud's processor type (the local stack sets its own).
# - AssistantModel: the Claude model the assistant asks, claude-sonnet-5-5, the one chosen on the
#   evaluation with the real model (docs/CONVERSATIONAL_PLAN.md section 2.2, open point P4).
# - AssistantDailyMessageLimit: 30 messages to the assistant per person and day, which with the
#   other limits bounds what one person can cost at Anthropic
#   (docs/CONVERSATIONAL_ARCHITECTURE.md section 4.4).
# - E-mail (docs/EMAIL_ARCHITECTURE.md section 13.1): MailStage, off, on, or domain in between
#   (its section 13.2); MailDomain, the domain mail is sent from; MailFromLocalPart and
#   MailFromName, the sender; PageAddress, the page an invitation points at. MailReplyTo is left
#   empty, so replies go to AlertEmail: a real address is never written here.
# The assistant's effort is not a parameter: the template leaves ASSISTANT_EFFORT empty in the
# cloud, which means the effort low.
#
# A trap: a --parameter-overrides typed on the command line (for example the AlertEmail of a
# first deploy) does not add to the list below, it replaces all of it: a parameter it leaves out
# is not set from this list at all. So such a command repeats every name below with its value
# (docs/RUNBOOK.md section 3).
[default.deploy.parameters]
region = "eu-north-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
s3_prefix = "shared-calendar-api"
parameter_overrides = "AdminUsername=\"admin\" FunctionArchitecture=\"arm64\" AssistantModel=\"claude-sonnet-5-5\" AssistantDailyMessageLimit=\"30\" MailStage=\"off\" MailDomain=\"enricopiccinin.com\" MailFromLocalPart=\"noreply\" MailFromName=\"Shared calendar\" PageAddress=\"https://calendar.enricopiccinin.com\""
image_repositories = []

# Laptop: sam local start-api against the Docker emulators (docs/IMPLEMENTATION_PLAN.md step 3).
[local.build.parameters]
cached = false
parallel = true
build_in_source = true

[local.local_start_api.parameters]
# AlertEmail has no default; only the alarms use it, and they do not run locally. MailStage on: the
# local stack runs e-mail as a stack at stage on does, against the fake mail
# (docs/EMAIL_ARCHITECTURE.md section 14.2), so the mailer is part of it.
parameter_overrides = "AlertEmail=local@example.invalid MailStage=on"
env_vars = "env.local.json"
docker_network = "shared-calendar-local"
# Each function's container starts on its first request and stays warm after. Starting them all
# at once (EAGER) could stall sam's start-up with this many functions, with nothing in the log.
warm_containers = "LAZY"
# No registry lookup per container (they ran in parallel without a timeout and could hang the
# start-up); scripts/local-api.sh pulls the Lambda base image once before starting instead.
skip_pull_image = true

# Laptop: sam local start-lambda, the functions' own invoke for the mailer's start
# (scripts/local-lambda.sh, docs/EMAIL_PLAN.md finding F3). The same environment and network as the
# API. No warm containers: each run of the mailer starts its own container, which sam removes after.
[local.local_start_lambda.parameters]
parameter_overrides = "AlertEmail=local@example.invalid MailStage=on"
env_vars = "env.local.json"
docker_network = "shared-calendar-local"
skip_pull_image = true
host = "127.0.0.1"
port = 3001
