        - PolicyName: write-own-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${SendAssistantMessageLogGroup}:log-stream:*
        - PolicyName: read-anthropic-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/anthropic-api-key

  # ---------------------------------------------------------------------------
  # Error alarms (docs/ARCHITECTURE.md section 11)
  # ---------------------------------------------------------------------------

  # A notification channel that forwards alarm messages to AlertEmail. After the first
  # deploy AWS sends a confirmation e-mail; no alarm e-mail arrives until it is confirmed.
  # Unconfirmed, AWS deletes the subscription after about two days and a redeploy does not
  # recreate it: subscribe again by hand (docs/RUNBOOK.md section 3).
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Fires when the authorizer crashes at least once in 5 minutes (callers then get a 500).
  AuthorizerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The authorizer Lambda failed at least once in 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuthorizerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # No invocations means no data, which is normal here, not an alarm.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # Fires when the API answers any request with a 5xx status at least once in 5 minutes.
  # Covers every route, including handlers that catch a failure and return 500 themselves
  # (those do not count as Lambda errors, so a per-function alarm would miss them).
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API returned at least one 5xx response in 5 minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

# Values printed after deployment; scripts read them with sam list stack-outputs. None is a secret.
Outputs:
  ApiUrl:
    Description: Base URL of the API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id used to sign in
    Value: !Ref UserPoolClient
  MessagesTableName:
    Description: DynamoDB table holding the messages
    Value: !Ref MessagesTable
  CalendarTableName:
    Description: DynamoDB table holding the shared calendar
    Value: !Ref CalendarTable
