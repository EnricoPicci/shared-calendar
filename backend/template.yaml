  # POST /assistant/messages (Administrator and Users): a message of the person. The function saves
  # it in the caller's conversation and asks Claude, at Anthropic, once. 29 seconds instead of the
  # usual 10, just under the 30 that API Gateway allows a request: Claude may take up to 22.
  # The Anthropic API key is not here. The function reads it, when it first needs it, from Parameter
  # Store (AWS's free store for settings and secrets), where the operator puts it as an encrypted
  # value named /<stack>/anthropic-api-key; ANTHROPIC_KEY_PARAMETER only carries that name, and the
  # role may read that one parameter and no other. Until the key is there the assistant answers
  # 503 assistant_unavailable and everything else works.
  # ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL and ASSISTANT_BUDGET_MEMORY_SECONDS are declared empty on
  # purpose: only the local stack fills them (env.local.json: the fake Claude's address, a
  # placeholder key, no memory of a spending limit between two journeys). In the cloud they stay
  # empty, so the key can only come from Parameter Store.
  SendAssistantMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sendAssistantMessage.handler
      Role: !GetAtt SendAssistantMessageRole.Arn
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref SendAssistantMessageLogGroup
      Environment:
        Variables:
          ASSISTANT_TABLE: !Ref AssistantTable
          CALENDAR_TIME_ZONE: !Ref CalendarTimeZone
          ASSISTANT_DAILY_MESSAGE_LIMIT: !Ref AssistantDailyMessageLimit
          DYNAMODB_ENDPOINT: ''
          ASSISTANT_MODEL: !Ref AssistantModel
          ANTHROPIC_KEY_PARAMETER: !Sub /${AWS::StackName}/anthropic-api-key
          ANTHROPIC_API_KEY: ''
          ANTHROPIC_BASE_URL: ''
          ASSISTANT_BUDGET_MEMORY_SECONDS: ''
      Events:
