  # ---------------------------------------------------------------------------
  # The assistant (docs/ARCHITECTURE.md section 4, "The assistant's routes")
  # ---------------------------------------------------------------------------
  # Three functions for a person's conversation with the assistant. None of them can touch the
  # calendar table or Cognito: their roles name the assistant table only, through its two shared
  # permission sets, and one of them the Anthropic API key. They get the calendar's time zone
  # because a person's day, for the daily limit, is counted in it.

  # GET /assistant/conversation (Administrator and Users): the caller's own conversation as a person
  # reads it. It only reads the assistant table (AssistantReadPolicy alone), so this function
  # cannot change a conversation even by mistake.
