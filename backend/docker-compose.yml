# Local emulators for development and integration tests (docs/ARCHITECTURE.md section 8).
# Start with `npm run local:up`, stop with `npm run local:down`.
#
# Ports are bound to 127.0.0.1 only, so nothing is reachable from the local network.
# DYNAMODB_PORT changes the host port of DynamoDB Local (default 8000) when another
# project already uses 8000; inside Docker it is always dynamodb:8000.

name: shared-calendar

services:
  # DynamoDB emulator. In memory: the table and its rows disappear on `local:down`.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - 127.0.0.1:${DYNAMODB_PORT:-8000}:8000
    networks:
      - shared-calendar-local

  # Web UI to browse the tables: http://localhost:8001
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
    ports:
      - 127.0.0.1:8001:8001
    depends_on:
      - dynamodb
    networks:
      - shared-calendar-local

  # Cognito emulator. Users, groups and pools are kept in ./.cognito across restarts.
  # `npm run local:up` first copies docker/cognito-local-config.json to .cognito/config.json
  # (copied, not mounted: the emulator rewrites the file). It changes two emulator defaults:
  # - usernames may be plain names; the emulator otherwise demands e-mail addresses, which
  #   real Cognito does not and our pool does not use;
  # - token issuer fixed to http://localhost:9229/<poolId>, the value env.local.json expects
  #   (the emulator otherwise writes http://0.0.0.0:9229/<poolId>).
  cognito:
    image: jagregory/cognito-local:5.3.0
    ports:
      - 127.0.0.1:9229:9229
    volumes:
      - ./.cognito:/app/.cognito
    networks:
      - shared-calendar-local

  # The fake Claude: a stand-in for Anthropic's API, so that the assistant runs and is tested
  # without an Anthropic account. One small script of plain Node (docker/fake-claude.mjs) on the
  # official Node image, which answers POST /v1/messages with the scripted answers of
  # tests/integration/fake-claude/answers.json. Both folders are mounted read-only: the container
  # can change nothing of the repository. The answers are read again at every request, so a change
  # to them needs no restart; a change to the script needs `docker compose restart fake-claude`.
  # From the host: http://localhost:9230. From the Lambda containers: http://fake-claude:9230.
  fake-claude:
    image: node:22.23.4-alpine3.23
    command: node /fake/fake-claude.mjs
    user: node
    read_only: true
    volumes:
      - ./docker:/fake:ro
      - ./tests/integration/fake-claude:/answers:ro
    ports:
      - 127.0.0.1:9230:9230
    networks:
      - shared-calendar-local

  # The fake mail: a stand-in for Amazon SES (docs/EMAIL_ARCHITECTURE.md section 14.2), so that the
  # mailer runs and is tested without an AWS account and no mail leaves the laptop. One small script
  # of plain Node (docker/fake-mail.mjs) on the official Node image, which answers SESv2's
  # SendEmail and keeps each mail, its files included, in memory until the container stops. The
  # folder is mounted read-only. A change to the script needs `docker compose restart fake-mail`.
  # A person reads the mails at http://localhost:8025, the journeys at http://localhost:8025/mails.
  # From the Lambda containers: http://fake-mail:8025.
  fake-mail:
    image: node:22.23.4-alpine3.23
    command: node /fake/fake-mail.mjs
    user: node
    read_only: true
    volumes:
      - ./docker:/fake:ro
    ports:
      - 127.0.0.1:8025:8025
    networks:
      - shared-calendar-local

# Fixed name (not prefixed by the project) so `sam local start-api --docker-network shared-calendar-local`
# can attach the Lambda containers to it and reach the services above by name.
networks:
  shared-calendar-local:
    name: shared-calendar-local
