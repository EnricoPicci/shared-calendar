<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared calendar — plain HTML</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- ── The login view ─────────────────────────────────────────────────────────────── -->
    <main id="login" class="login" hidden>
      <h1>Shared calendar</h1>
      <form>
        <label>Username <input name="username" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary">Sign in</button>
        <p class="error" role="alert"></p>
      </form>
    </main>

    <!-- ── The calendar view ──────────────────────────────────────────────────────────── -->
    <main id="calendar" hidden>
      <header class="bar">
        <strong>Shared calendar</strong>
        <span class="who"></span>
        <button type="button" class="sign-out">Sign out</button>
      </header>

      <nav class="toolbar">
        <button type="button" class="previous" aria-label="Previous week">‹</button>
        <button type="button" class="today">Today</button>
        <button type="button" class="next" aria-label="Next week">›</button>
        <h2 class="week-label"></h2>
        <span class="loading" hidden>Loading…</span>
      </nav>
      <p class="error week-error" role="alert" hidden></p>
      <p class="zone"></p>
      <ul class="legend"></ul>

      <div class="week">
        <ol class="hours"></ol>
        <div class="days"></div>
      </div>

      <!-- Booking a free slot -->
      <dialog class="book">
        <form>
          <h3>Book an appointment</h3>
          <p class="what"></p>
          <label class="for-user" hidden>For <select name="username"></select></label>
          <label>Note <textarea name="note" rows="3"></textarea></label>
          <p class="error" role="alert"></p>
          <div class="actions">
            <button type="button" class="close">Close</button>
            <button class="primary submit">Book</button>
          </div>
        </form>
      </dialog>

      <!-- One appointment -->
      <dialog class="detail">
        <div class="detail-body">
          <h3>Appointment</h3>
          <dl>
            <dt>When</dt>
            <dd class="when"></dd>
            <dt>Type</dt>
            <dd class="type"></dd>
            <dt>Who</dt>
            <dd class="who"></dd>
            <dt>Note</dt>
            <dd class="note"></dd>
          </dl>
          <p class="hint"></p>
          <p class="error" role="alert"></p>
          <div class="actions">
            <button type="button" class="close">Close</button>
            <button type="button" class="danger cancel">Cancel appointment</button>
          </div>
        </div>
      </dialog>

      <!-- The pieces the script copies to draw a week -->
      <template id="tpl-day">
        <section class="day">
          <h3></h3>
          <div class="day-body"></div>
        </section>
      </template>
      <template id="tpl-window">
        <div class="block window"></div>
      </template>
      <template id="tpl-busy">
        <div class="block busy"><span class="time"></span> busy</div>
      </template>
      <template id="tpl-slot">
        <button type="button" class="block slot"><span class="time"></span> free</button>
      </template>
      <template id="tpl-appointment">
        <button type="button" class="block appointment">
          <span class="time"></span> <strong class="who"></strong> <span class="note"></span>
        </button>
      </template>
    </main>
  </body>
</html>
